// DNF 2001 Vita — 60fps performance config.
// ONLY cvars valid in this engine build (invalid ones just spam warnings):
// r_precache / r_ambientlight / r_novoxmips / r_maxfps / snd_mixrate / snd_numvoices
// (verified in osdcmds.cpp). Loaded BEFORE sound init, so audio + fps cap apply.
// Load packaged Vita control bindings (same folder search path as game data)
exec dnf_controls.cfg

r_precache 1
r_ambientlight 1.0
r_novoxmips 1
r_maxfps 60
snd_mixrate 22050
snd_numvoices 32
