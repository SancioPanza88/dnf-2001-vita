// DNF 2001 Vita GL build — performance config for the experimental vitaGL renderer.
// Loaded via: -cfg ux0:data/DNF/dnf_gl.cfg (see patch_gl_args.py).
// All cvars verified in this engine version (osdcmds.cpp / polymost.cpp).
// Aggressive on purpose: re-enable lines one by one to bisect what costs most.

// Same bindings as the stable build
exec dnf_controls.cfg

// Engine / audio (same as stable 60fps config)
r_precache 1
r_novoxmips 1
r_maxfps 60
snd_mixrate 22050
snd_numvoices 32

// Polymost fill-rate killers OFF (biggest GPU wins; delete a line to re-enable)
r_detailmapping 0
r_glowmapping 0
r_models 0
r_hightile 0
