name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check (all scripts + tests)
        run: python -m compileall -q scripts tests

      - name: Shell syntax check (build script)
        run: bash -n build_vita.sh

      - name: Patch self-tests (60fps suite)
        run: python -m unittest discover -s tests -v

      - name: 60fps checklist (repo contents)
        run: |
          grep -q "snd_mixrate 22050" AUTOEXEC.CFG
          grep -q "r_maxfps 60" AUTOEXEC.CFG
          grep -q "patch_framerate.py" build_vita.sh
          grep -q "patch_audio_defaults.py" build_vita.sh
          grep -q "vita2d_set_vblank_wait(1)" scripts/patch_framerate.py
          grep -q "MixRate = 22050" scripts/patch_audio_defaults.py
          grep -q "patch_glrenderer.py" build_vita.sh
          grep -q "gen_gl_procaddr.py" build_vita.sh
          echo "60fps checklist OK"

  vpk-stable:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install VitaSDK libraries
        run: |
          apt-get update && apt-get install -y subversion pkg-config p7zip-full
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          vdpm --version || true
          for p in sdl sdl_mixer vita2d flac libogg libvorbis mpg123 mikmod speexdsp libpng jpeg zlib; do
            echo "== vdpm $p =="
            if vdpm "$p"; then echo "OK $p"; else echo "WARN: vdpm $p failed, continuing"; fi
          done

      - name: Build stable VPK (software renderer)
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          bash build_vita.sh

      - name: Upload stable VPK
        uses: actions/upload-artifact@v4
        with:
          name: DNF2001_Vita-stable
          path: DNF2001_Vita.vpk
          if-no-files-found: error

  vpk-gl:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install VitaSDK libraries (+vitaGL)
        run: |
          apt-get update && apt-get install -y subversion pkg-config p7zip-full
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          vdpm --version || true
          for p in sdl sdl_mixer vita2d vitagl flac libogg libvorbis mpg123 mikmod speexdsp libpng jpeg zlib; do
            echo "== vdpm $p =="
            if vdpm "$p"; then echo "OK $p"; else echo "WARN: vdpm $p failed, continuing"; fi
          done

      - name: Build EXPERIMENTAL vitaGL VPK (GPU renderer)
        run: |
          export VITASDK=/usr/local/vitasdk
          export PATH="$VITASDK/bin:$PATH"
          BUILD_GL=1 bash build_vita.sh

      - name: Upload experimental GL VPK
        uses: actions/upload-artifact@v4
        with:
          name: DNF2001_Vita-GL-experimental
          path: DNF2001_Vita_GL.vpk
          if-no-files-found: warn
